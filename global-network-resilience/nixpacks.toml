[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_pgsql",
  "php82Extensions.pgsql",
  "postgresql",
  "python311",
  "curl",
  "mtr",
  "iputils"
]

[phases.install]
cmds = [
  "python3 -m venv .venv",
  ".venv/bin/pip install --no-cache-dir -r scripts/requirements.txt"
]

[start]
cmd = "bash start.sh"