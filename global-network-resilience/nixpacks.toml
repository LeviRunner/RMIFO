[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_pgsql",
  "php82Extensions.pgsql",
  "postgresql",
  "nodejs_20",
  "curl",
  "mtr",
  "iputils",
  "python312",
  "python312Packages.pip",
  "wireguard-tools"
]

[phases.install]
cmds = [
  "npm install --omit=dev",
  "pip install --quiet psycopg2-binary schedule"
]

[start]
cmd = "bash start.sh"