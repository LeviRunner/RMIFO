[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_pgsql",
  "php82Extensions.pgsql",
  "postgresql",
  "nodejs_20",
  "curl",
  "mtr",
  "iputils",
  "python312",
  "python312Packages.psycopg2",
  "python312Packages.schedule",
  "wireguard-tools"
]

[phases.install]
cmds = [
